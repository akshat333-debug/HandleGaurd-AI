[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handleguard-ai"
version = "0.1.0"
description = "AI warehouse handling intelligence — damage-prevention decision system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
cv = ["opencv-python-headless>=4.9"]

[tool.setuptools.packages.find]
include = ["handleguard*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
