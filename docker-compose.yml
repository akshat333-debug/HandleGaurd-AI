services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      HANDLEGUARD_ENV: production
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      VITE_API_PROXY: http://api:8000
